<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VeggieChain">
  <title>VeggieChain</title>

  <defs>
    <!-- Diagonal gradient: deep forest green (leaf/bend) -> vibrant lime (chain links). -->
    <linearGradient id="vcGreen" x1="96" y1="448" x2="448" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E6B34"/>
      <stop offset="0.5" stop-color="#3C8C36"/>
      <stop offset="1" stop-color="#6EC033"/>
    </linearGradient>

    <!-- Slightly lighter green, memudar di ujung agar menyatu dengan bend. -->
    <linearGradient id="vcHighlight" x1="228" y1="330" x2="312" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9BD968"/>
      <stop offset="0.7" stop-color="#8FD45C"/>
      <stop offset="1" stop-color="#8FD45C" stop-opacity="0"/>
    </linearGradient>

    <!-- Negative-space vein cutout, tapering from below the tip down into the stem. -->
    <mask id="vcVein" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <path d="M 140 112
               C 154 158 172 210 189 254
               C 204 294 220 330 234 352
               C 236 356 232 359 228 356
               C 212 334 198 300 183 262
               C 165 216 146 164 133 118
               C 132 114 136 110 140 112 Z"
            fill="#000000"/>
    </mask>

    <!-- Potong ujung bend agar tidak menonjol ke lubang ring pertama. -->
    <mask id="vcBendClip" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="-41" y="-14" width="82" height="28" rx="14"
            transform="translate(338 328) rotate(-45)" fill="#000000"/>
    </mask>

    <!-- Gap that makes the two chain links interlock at one crossing. -->
    <mask id="vcLinkGap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <circle cx="357" cy="268" r="24" fill="#000000"/>
    </mask>
  </defs>

  <!-- Bottom curve of the V: stem bends into a rounded U with a lighter inner fold. -->
  <g mask="url(#vcBendClip)">
    <path d="M 236 322 C 244 382 260 406 284 406 C 302 404 310 376 318 348"
          fill="none" stroke="url(#vcGreen)" stroke-width="50" stroke-linecap="round"/>
    <path d="M 230 324 C 238 376 254 398 279 398 C 296 396 304 368 310 342"
          fill="none" stroke="url(#vcHighlight)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Left arm: pointed organic leaf with a central vein cut out. -->
  <path d="M 126 78
           C 126 128 136 192 152 242
           C 172 296 208 336 246 358
           C 254 312 246 252 228 212
           C 208 168 166 114 126 78 Z"
        fill="url(#vcGreen)" mask="url(#vcVein)"/>

  <!-- Right arm: two interlocking stadium links turning upward at 45 degrees. -->
  <rect x="-56" y="-29" width="112" height="58" rx="29"
        transform="translate(338 328) rotate(-45)"
        fill="none" stroke="url(#vcGreen)" stroke-width="30"/>
  <g mask="url(#vcLinkGap)">
    <rect x="-56" y="-29" width="112" height="58" rx="29"
          transform="translate(417 249) rotate(-45)"
          fill="none" stroke="#6EC033" stroke-width="30"/>
  </g>
</svg>
